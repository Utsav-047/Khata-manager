version: "3.8"

services:
  db:
    image: mariadb:10.11
    container_name: khata_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-KhataRootSecure2026!}
      MYSQL_DATABASE: ${DB_NAME:-khata_management}
      MYSQL_USER: ${DB_USER:-khata_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-KhataUserPass2026!}
    volumes:
      - khata_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khata_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-khata_user}
      DB_PASSWORD: ${DB_PASSWORD:-KhataUserPass2026!}
      DB_NAME: ${DB_NAME:-khata_management}
      SECRET_KEY: ${SECRET_KEY:-generate_with_python_secrets_token_hex_32}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yourdomain.com}
      BUSINESS_NAME: "Kisan Krishi Seva Kendra"
      BUSINESS_CURRENCY_SYMBOL: "₹"
      BUSINESS_TIMEZONE: "Asia/Kolkata"
    ports:
      - "8000:8000"

volumes:
  khata_db_data:
    driver: local

